name: zig

on:
  push:
    branches:
      - main
    paths:
      - 'zig/**'
      - '.github/workflows/zig.yml'
  pull_request:
    paths:
      - 'zig/**'
      - '.github/workflows/zig.yml'

jobs:
  build:
    name: zig ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check .
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all
